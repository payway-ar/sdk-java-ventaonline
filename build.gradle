plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
}

version = '2.8.5'
group = 'com.decidir.api'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

allprojects {
    apply plugin: 'java'
    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

jar {
    manifest {
        attributes 'Implementation-Title': 'Java SDK for Payway', 'Implementation-Version': version
    }
}

//create a single Jar with all dependencies
task releaseJar(type: Jar) {
    manifest {
        attributes 'Implementation-Title': 'Java SDK for Payway', 'Implementation-Version': version
    }

    // CORRECCIONES PARA GRADLE 7+
    archiveFileName = 'payway-v' + version + '-java7.jar'
    destinationDirectory = project.file('dist')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE // Obligatorio en Gradle 7 al combinar librerías

    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

repositories {
    mavenCentral()
    maven {
        url "https://oss.sonatype.org/content/repositories/snapshots/"
        allowInsecureProtocol = true
    }
}

dependencies {
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation "com.squareup.retrofit2:converter-jackson:2.11.0"
    implementation 'com.squareup.okio:okio:3.10.2'
    implementation 'com.google.code.gson:gson:2.8.9'
}

publishing {
    publications {
        mavenJar(MavenPublication) {
            artifact releaseJar
            artifactId = 'payway-sdk-java7'
            version = project.version
        }
    }
}